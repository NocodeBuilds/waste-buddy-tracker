<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="hsl(158 64% 28%)" />
    <meta name="description" content="Track and manage waste generation, activities, and disposal operations across your facilities." />
    <meta name="keywords" content="waste, tracking, compliance, disposal, PWA, hazardous waste" />
    <meta name="author" content="Waste Buddy" />

    <title>WasteBuddy</title>
    <link rel="canonical" href="/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WasteBuddy" />

    <!-- Android / PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="WasteBuddy" />
    <meta name="msapplication-TileColor" content="hsl(158 64% 28%)" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Open Graph -->
    <meta property="og:title" content="WasteBuddy" />
    <meta property="og:description" content="Track and manage waste generation, activities, and disposal operations across your facilities." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WasteBuddy" />
    <meta name="twitter:description" content="Track and manage waste generation, activities, and disposal operations across your facilities." />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WasteBuddy",
        "applicationCategory": "BusinessApplication",
        "description": "Track and manage waste generation, activities, and disposal operations across your facilities.",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        document.getElementById('root').innerHTML = '<pre style="padding:20px;color:red;font-size:14px;">' + e.message + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML = '<pre style="padding:20px;color:red;font-size:14px;">' + (e.reason?.message || e.reason) + '</pre>';
      });
    </script>
  </body>
</html>
